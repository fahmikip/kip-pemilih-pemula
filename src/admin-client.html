<script>
(function(){
  var state={token:'',seasons:[]};
  function call(name,args,done){var runner=google.script.run.withSuccessHandler(done).withFailureHandler(function(){window.PM.notify('Koneksi ke layanan terputus.')});runner[name].apply(runner,args)}
  function esc(value){var node=document.createElement('div');node.textContent=String(value==null?'':value);return node.innerHTML}
  function show(name){document.querySelectorAll('.admin-screen').forEach(function(el){el.classList.toggle('active',el.dataset.adminScreen===name)});document.querySelectorAll('[data-admin-target]').forEach(function(el){el.classList.toggle('active',el.dataset.adminTarget===name)});document.querySelector('.admin-sidebar').classList.remove('open');if(name==='participants')loadParticipants();if(name==='schools')loadSchools();if(name==='seasons')loadSeasons();if(name==='questions')loadQuestions();if(name==='rewards')loadRewards()}
  function dashboard(){call('getAdminDashboard',[state.token],function(response){if(!response.success){sessionStorage.removeItem('pm_session');window.PM.notify(response.message);setTimeout(function(){location.reload()},600);return}var data=response.data,s=data.stats;document.getElementById('admin-name').textContent=data.admin.name;document.getElementById('admin-role').textContent=data.admin.role;document.getElementById('admin-date').textContent=data.date;document.getElementById('stat-participants').textContent=s.participants;document.getElementById('stat-active').textContent=s.activeParticipants;document.getElementById('stat-pending').textContent=s.pendingParticipants;document.getElementById('stat-schools').textContent=s.schools;document.getElementById('stat-quiz').textContent=s.completedQuiz;document.getElementById('stat-season').textContent=s.activeSeason;document.getElementById('admin-activity').innerHTML=data.recentActivity.length?data.recentActivity.map(function(item){return '<div class="activity-row"><b>'+esc(item.action)+'</b><span>'+esc(item.description)+'</span><small>'+esc(item.timestamp)+'</small></div>'}).join(''):'<p>Belum ada aktivitas.</p>'})}
  function loadParticipants(){call('listParticipants',[state.token,{search:document.getElementById('participant-search').value,status:document.getElementById('participant-status').value,pageSize:50}],function(response){if(!response.success){window.PM.notify(response.message);return}document.getElementById('participant-table').innerHTML=response.data.participants.map(function(item){return '<tr><td><b>'+esc(item.name)+'</b><small>'+esc(item.nis)+' • '+esc(item.className)+'</small></td><td>'+esc(item.school)+'</td><td><small>'+esc(item.email)+'<br>'+esc(item.whatsapp)+'</small></td><td>'+item.point+'</td><td><span class="status-badge '+item.status.toLowerCase()+'">'+item.status+'</span></td><td>'+(item.status!=='ACTIVE'?'<button data-user-status="ACTIVE" data-user="'+item.userId+'">Validasi</button>':'<button class="danger-button compact" data-user-status="SUSPENDED" data-user="'+item.userId+'">Suspend</button>')+'</td></tr>'}).join('');document.querySelectorAll('[data-user-status]').forEach(function(button){button.addEventListener('click',function(){var status=button.dataset.userStatus,reason=status==='ACTIVE'?'':prompt('Alasan suspend:');if(status!=='ACTIVE'&&!reason)return;call('setParticipantStatus',[state.token,button.dataset.user,status,reason],function(result){window.PM.notify(result.message);if(result.success)loadParticipants()})})})})}
  function loadSchools(){call('listAdminSchools',[state.token],function(response){if(!response.success)return;document.getElementById('school-list').innerHTML=response.data.schools.map(function(item){return '<article class="admin-row"><div><b>'+esc(item.NamaSekolah)+'</b><small>'+esc(item.NPSN)+' • '+esc(item.Jenis)+' • '+esc(item.Kecamatan)+'</small></div><span class="status-badge '+String(item.Status).toLowerCase()+'">'+item.Status+'</span></article>'}).join('')})}
  function loadSeasons(){call('listSeasons',[state.token],function(response){if(!response.success)return;state.seasons=response.data.seasons;document.getElementById('season-list').innerHTML=state.seasons.map(function(item){return '<article class="admin-row"><div><b>'+esc(item.NamaSeason)+'</b><small>'+esc(item.TanggalMulai)+' — '+esc(item.TanggalSelesai)+' • '+item.JumlahSoal+' soal</small></div><div><span class="status-badge '+String(item.Status).toLowerCase()+'">'+item.Status+'</span> '+(item.Status!=='ACTIVE'?'<button data-activate="'+item.SeasonID+'">Aktifkan</button>':'')+'</div></article>'}).join('');var select=document.getElementById('winner-season');select.innerHTML='<option value="">Pilih season</option>'+state.seasons.map(function(item){return '<option value="'+item.SeasonID+'">'+esc(item.NamaSeason)+'</option>'}).join('');document.querySelectorAll('[data-activate]').forEach(function(button){button.addEventListener('click',function(){call('activateSeason',[state.token,button.dataset.activate],function(result){window.PM.notify(result.message);if(result.success)loadSeasons()})})})})}
  function loadQuestions(){call('listQuestions',[state.token,{pageSize:50}],function(response){if(!response.success)return;document.getElementById('question-list').innerHTML=response.data.questions.map(function(item){return '<article class="admin-row"><div><b>'+esc(item.Pertanyaan)+'</b><small>'+esc(item.Kategori)+' • '+item.Difficulty+' • '+item.Point+' point</small></div><div><span class="status-badge '+String(item.Status).toLowerCase()+'">'+item.Status+'</span> <button data-question-toggle="'+item.QuestionID+'" data-status="'+(item.Status==='ACTIVE'?'INACTIVE':'ACTIVE')+'">'+(item.Status==='ACTIVE'?'Nonaktifkan':'Aktifkan')+'</button> <button data-question-copy="'+item.QuestionID+'">Duplikasi</button></div></article>'}).join('');document.querySelectorAll('[data-question-toggle]').forEach(function(button){button.addEventListener('click',function(){call('setQuestionStatus',[state.token,button.dataset.questionToggle,button.dataset.status],function(result){window.PM.notify(result.message);if(result.success)loadQuestions()})})});document.querySelectorAll('[data-question-copy]').forEach(function(button){button.addEventListener('click',function(){call('duplicateQuestion',[state.token,button.dataset.questionCopy],function(result){window.PM.notify(result.message);if(result.success)loadQuestions()})})})})}
  function loadCandidates(){var seasonId=document.getElementById('winner-season').value;if(!seasonId)return;call('getWinnerCandidates',[state.token,seasonId],function(response){if(!response.success){window.PM.notify(response.message);return}var data=response.data,summary='<div class="admin-card"><b>Status: '+data.status+'</b><p>'+data.summary.participants+' peserta • '+data.summary.quizCompleted+' quiz selesai</p>'+(data.winner?'<button data-create-reward="'+data.winner.WinnerID+'">Buat Reward Pemenang</button>':'')+'</div>';document.getElementById('candidate-list').innerHTML=summary+data.candidates.map(function(item){return '<article class="admin-row"><div><b>#'+item.rank+' '+esc(item.name)+'</b><small>'+esc(item.school)+' • '+item.point+' pt • '+item.correct+' benar • avg '+item.averageScore+' • fraud '+item.fraudRisk+'</small></div><div><button data-winner-validate="'+item.userId+'">Validate</button><button class="danger-button compact" data-winner-disqualify="'+item.userId+'">Disqualify</button></div></article>'}).join('');document.querySelectorAll('[data-winner-validate]').forEach(function(button){button.addEventListener('click',function(){call('finalizeWinner',[state.token,{seasonId:seasonId,userId:button.dataset.winnerValidate,action:'VALIDATE',reason:''}],function(result){window.PM.notify(result.message);if(result.success)loadCandidates()})})});document.querySelectorAll('[data-winner-disqualify]').forEach(function(button){button.addEventListener('click',function(){var reason=prompt('Alasan diskualifikasi:');if(!reason)return;call('finalizeWinner',[state.token,{seasonId:seasonId,userId:button.dataset.winnerDisqualify,action:'DISQUALIFY',reason:reason}],function(result){window.PM.notify(result.message);if(result.success)loadCandidates()})})});var rewardButton=document.querySelector('[data-create-reward]');if(rewardButton)rewardButton.addEventListener('click',function(){var nominal=Number(prompt('Nominal reward:','100000')),provider=prompt('Provider:','');if(!Number.isFinite(nominal))return;call('createRewardForWinner',[state.token,rewardButton.dataset.createReward,{name:data.winner.Reward,nominal:nominal,provider:provider}],function(result){window.PM.notify(result.message)})})})}
  function loadRewards(){call('listRewards',[state.token],function(response){if(!response.success)return;document.getElementById('reward-list').innerHTML=response.data.rewards.length?response.data.rewards.map(function(item){return '<article class="admin-row"><div><b>'+esc(item.NamaReward)+' — '+esc(item.WinnerName)+'</b><small>'+esc(item.Provider)+' • '+esc(item.NomorTujuan)+' • Rp'+Number(item.Nominal||0).toLocaleString('id-ID')+'</small></div><select data-reward="'+item.RewardID+'"><option>'+item.Status+'</option>'+['WAITING','VERIFIED','SENT','COMPLETED'].filter(function(s){return s!==item.Status}).map(function(s){return '<option>'+s+'</option>'}).join('')+'</select></article>'}).join(''):'<div class="admin-card">Belum ada reward.</div>';document.querySelectorAll('[data-reward]').forEach(function(select){select.addEventListener('change',function(){call('updateRewardStatus',[state.token,select.dataset.reward,select.value,'Diperbarui melalui admin console'],function(result){window.PM.notify(result.message);if(!result.success)loadRewards()})})})})}
  function start(token){state.token=token;document.querySelectorAll('.public-view').forEach(function(el){el.hidden=true});document.getElementById('student-app').hidden=true;document.getElementById('admin-app').hidden=false;dashboard();loadSeasons()}
  document.querySelectorAll('[data-admin-target]').forEach(function(button){button.addEventListener('click',function(){show(button.dataset.adminTarget)})});document.getElementById('admin-menu').addEventListener('click',function(){document.querySelector('.admin-sidebar').classList.toggle('open')});document.getElementById('refresh-participants').addEventListener('click',loadParticipants);document.getElementById('participant-search').addEventListener('change',loadParticipants);document.getElementById('participant-status').addEventListener('change',loadParticipants);document.getElementById('refresh-seasons').addEventListener('click',loadSeasons);document.getElementById('refresh-questions').addEventListener('click',loadQuestions);document.getElementById('refresh-rewards').addEventListener('click',loadRewards);document.getElementById('load-candidates').addEventListener('click',loadCandidates);document.getElementById('school-form').addEventListener('submit',function(event){event.preventDefault();var form=this,data=Object.fromEntries(new FormData(form));call('createSchool',[state.token,data],function(response){window.PM.notify(response.message);if(response.success){form.reset();loadSchools()}})});document.getElementById('season-form').addEventListener('submit',function(event){event.preventDefault();var form=this,data=Object.fromEntries(new FormData(form));data.status='DRAFT';data.randomQuestion=true;data.randomAnswer=true;call('createSeason',[state.token,data],function(response){window.PM.notify(response.message);if(response.success){form.reset();loadSeasons()}})});document.getElementById('question-form').addEventListener('submit',function(event){event.preventDefault();var form=this,data=Object.fromEntries(new FormData(form));data.status='ACTIVE';call('createQuestion',[state.token,data],function(response){window.PM.notify(response.message);if(response.success){form.reset();loadQuestions()}})});document.getElementById('admin-logout').addEventListener('click',function(){call('logout',[state.token],function(){sessionStorage.removeItem('pm_session');location.reload()})});window.PM.startAdmin=start;
})();
</script>
