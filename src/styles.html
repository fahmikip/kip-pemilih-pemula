<style>
:root{--primary:#123b66;--primary-dark:#0b2948;--secondary:#1f6f8b;--accent:#f6c344;--success:#18864b;--warning:#d97706;--danger:#c33b3b;--background:#f4f7fb;--surface:#fff;--text-primary:#142033;--text-secondary:#667085;--border:#dce3ec;--radius:20px;--shadow:0 18px 50px rgba(18,59,102,.12)}
*{box-sizing:border-box}body{margin:0;background:var(--background);color:var(--text-primary);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.shell{min-height:100vh;padding:28px 20px;background:radial-gradient(circle at 90% 10%,rgba(246,195,68,.25),transparent 28%)}.brand{font-weight:900;letter-spacing:.08em;color:var(--primary)}.hero{max-width:720px;margin:12vh auto 40px;background:var(--surface);padding:clamp(28px,6vw,64px);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}.eyebrow{display:inline-block;color:var(--secondary);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.75rem}.hero h1{font-size:clamp(2.2rem,8vw,4.8rem);line-height:.98;letter-spacing:-.055em;margin:20px 0}.hero h1 em{font-style:normal;color:var(--primary)}.hero p{color:var(--text-secondary);line-height:1.7}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}button{min-height:48px;border:0;border-radius:14px;padding:0 22px;background:var(--primary);color:#fff;font-weight:800;text-transform:uppercase}button.secondary{background:#e8eef5;color:var(--primary)}button:disabled{opacity:.55}.status{max-width:720px;margin:auto;display:flex;align-items:center;gap:9px;color:var(--text-secondary);font-size:.9rem}.dot{width:9px;height:9px;border-radius:50%;background:var(--success)}
</style>
