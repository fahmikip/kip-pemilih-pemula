<style>
:root{--primary:#123b66;--primary-dark:#0b2948;--secondary:#1f6f8b;--accent:#f6c344;--success:#18864b;--warning:#d97706;--danger:#c33b3b;--background:#f4f7fb;--surface:#fff;--text-primary:#142033;--text-secondary:#667085;--border:#dce3ec;--radius:20px;--shadow:0 18px 50px rgba(18,59,102,.12)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--background);color:var(--text-primary);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}.topbar{height:76px;display:flex;align-items:center;justify-content:space-between;padding:0 max(20px,calc((100vw - 1180px)/2));background:rgba(244,247,251,.88);backdrop-filter:blur(16px);position:sticky;top:0;z-index:5;border-bottom:1px solid rgba(220,227,236,.7)}.brand{font-weight:900;letter-spacing:.08em;color:var(--primary);text-decoration:none}.topbar nav{display:flex;gap:8px}.shell{min-height:calc(100vh - 76px);padding:60px 20px;background:radial-gradient(circle at 90% 5%,rgba(246,195,68,.28),transparent 27%)}.hero{max-width:1180px;margin:auto;display:grid;grid-template-columns:1.5fr .7fr;align-items:center;gap:64px;padding:42px 0 80px}.eyebrow{display:inline-block;color:var(--secondary);font-weight:800;text-transform:uppercase;letter-spacing:.08em;font-size:.75rem}.hero h1{font-size:clamp(2.7rem,6vw,5.7rem);line-height:.96;letter-spacing:-.06em;margin:20px 0}.hero h1 em{font-style:normal;color:var(--primary)}.hero p{color:var(--text-secondary);line-height:1.7;max-width:650px;font-size:1.08rem}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:28px}button{min-height:46px;border:0;border-radius:13px;padding:0 20px;background:var(--primary);color:#fff;font:inherit;font-weight:800;cursor:pointer}button:hover{filter:brightness(.94)}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(31,111,139,.28);outline-offset:2px}button.secondary,button.link{background:#e8eef5;color:var(--primary)}.score-card{background:var(--primary);color:#fff;padding:34px;border-radius:28px;box-shadow:0 28px 70px rgba(18,59,102,.25);transform:rotate(2deg)}.score-card span,.score-card small{display:block;color:#cddcea}.score-card strong{display:block;font-size:6rem;letter-spacing:-.08em;color:var(--accent);line-height:1.1}.score-card b{font-size:.8rem;letter-spacing:.1em}.meter{height:9px;background:rgba(255,255,255,.16);border-radius:9px;margin:30px 0 12px;overflow:hidden}.meter i{display:block;width:72%;height:100%;background:var(--accent)}.steps{max-width:1180px;margin:auto;display:grid;grid-template-columns:repeat(3,1fr);gap:16px}.steps article{background:var(--surface);padding:26px;border:1px solid var(--border);border-radius:var(--radius)}.steps article>b{color:var(--secondary)}.steps h2{margin:18px 0 7px}.steps p{color:var(--text-secondary);margin:0}.status{max-width:1180px;margin:28px auto 0;display:flex;align-items:center;gap:9px;color:var(--text-secondary);font-size:.9rem}.dot{width:9px;height:9px;border-radius:50%;background:var(--success)}dialog{width:min(680px,calc(100% - 24px));max-height:calc(100vh - 24px);border:0;border-radius:24px;padding:0;box-shadow:0 30px 90px rgba(11,41,72,.3)}dialog::backdrop{background:rgba(11,25,42,.58);backdrop-filter:blur(5px)}.auth-panel{padding:42px}.auth-panel h2{font-size:2rem;margin:8px 0 28px}.close{position:absolute;right:16px;top:14px;border-radius:50%;padding:0;width:44px;background:#edf2f7;color:var(--primary);font-size:1.5rem}.auth-panel form{display:grid;gap:16px}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.wide{grid-column:1/-1}label{display:grid;gap:7px;color:var(--text-secondary);font-size:.86rem;font-weight:700}input,select{width:100%;min-height:46px;border:1px solid var(--border);border-radius:11px;padding:0 13px;background:#fff;color:var(--text-primary);font:inherit}.agreement{grid-template-columns:22px 1fr;align-items:start;line-height:1.5}.agreement input{min-height:auto;width:18px;height:18px;margin-top:2px}.switch{text-align:center;color:var(--text-secondary)}.text-button{padding:0;min-height:auto;background:transparent;color:var(--secondary)}#toast{position:fixed;z-index:20;left:50%;bottom:24px;transform:translate(-50%,130%);opacity:0;max-width:calc(100% - 32px);padding:13px 18px;border-radius:12px;background:var(--primary-dark);color:#fff;box-shadow:var(--shadow);transition:.25s}#toast.show{transform:translate(-50%,0);opacity:1}button[disabled]{opacity:.58;cursor:wait}
@media(max-width:760px){.topbar{height:66px}.shell{padding-top:30px}.hero{grid-template-columns:1fr;gap:28px;padding:20px 0 50px}.hero h1{font-size:clamp(2.5rem,13vw,4rem)}.score-card{transform:none}.steps{grid-template-columns:1fr}.auth-panel{padding:34px 20px 24px}.form-grid{grid-template-columns:1fr}.wide{grid-column:auto}.topbar .link{display:none}}
</style>
