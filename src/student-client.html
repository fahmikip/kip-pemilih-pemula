<script>
(function(){
  var state={token:'',dashboard:null};
  function call(name,args,done){var runner=google.script.run.withSuccessHandler(done).withFailureHandler(function(){window.PM.notify('Koneksi ke layanan terputus.')});runner[name].apply(runner,args)}
  function text(id,value){document.getElementById(id).textContent=value==null?'—':value}
  function escape(value){var node=document.createElement('div');node.textContent=String(value||'');return node.innerHTML}
  function showScreen(name){document.querySelectorAll('.app-screen').forEach(function(el){el.classList.toggle('active',el.dataset.screen===name)});document.querySelectorAll('.bottom-nav [data-screen-target]').forEach(function(el){el.classList.toggle('active',el.dataset.screenTarget===name)});if(name==='profile')loadProfile();window.scrollTo({top:0,behavior:'smooth'})}
  function rankRows(items){return items.length?items.map(function(item){return '<article class="rank-row"><strong>#'+item.rank+'</strong><div><span>'+escape(item.name)+'</span><small>'+escape(item.school)+'</small></div><b>'+Number(item.point).toLocaleString('id-ID')+' pt</b></article>'}).join(''):'<div class="empty-card">Belum ada perolehan point.</div>'}
  function materialCards(items){return items.length?items.map(function(item){return '<article class="material-card"><small>'+escape(item.category)+'</small><h3>'+escape(item.title)+'</h3><p>'+escape(String(item.content||'').slice(0,140))+'</p></article>'}).join(''):'<div class="empty-card">Materi belum tersedia.</div>'}
  function render(data){state.dashboard=data;text('student-name',data.user.name.split(' ')[0]);text('student-school',data.user.schoolName||'Sekolah belum tersedia');text('student-initial',data.user.name.charAt(0).toUpperCase());text('student-point',Number(data.point).toLocaleString('id-ID'));text('student-rank',data.rank?'#'+data.rank:'—');text('season-name',data.season?data.season.name:'Belum ada season aktif');text('season-theme',data.season?(data.season.theme||data.season.description):'Challenge berikutnya akan segera hadir.');text('progress-label',data.progress+'%');document.getElementById('progress-bar').style.width=data.progress+'%';document.getElementById('start-quiz').disabled=!data.season;document.getElementById('top-three').className='rank-list';document.getElementById('top-three').innerHTML=rankRows(data.topThree);document.getElementById('rank-screen-list').innerHTML=rankRows(data.leaderboard||data.topThree);document.getElementById('material-preview').innerHTML=materialCards(data.materials);document.getElementById('material-list').innerHTML=materialCards(data.materials);document.getElementById('announcement-list').innerHTML=data.announcements.length?data.announcements.map(function(item){return '<article class="announcement"><b>'+escape(item.title)+'</b><p>'+escape(item.content)+'</p></article>'}).join(''):'<div class="empty-card">Belum ada pengumuman.</div>';document.getElementById('app-loading').hidden=true;document.getElementById('app-content').hidden=false}
  function start(token){state.token=token;document.querySelectorAll('.public-view').forEach(function(el){el.hidden=true});document.getElementById('student-app').hidden=false;document.getElementById('app-loading').hidden=false;document.getElementById('app-content').hidden=true;call('getStudentDashboard',[token],function(response){if(!response.success){sessionStorage.removeItem('pm_session');window.PM.notify(response.message);setTimeout(function(){location.reload()},700);return}render(response.data)})}
  function loadProfile(){if(!state.token)return;call('getStudentProfile',[state.token],function(response){if(!response.success){window.PM.notify(response.message);return}var labels={name:'Nama lengkap',nis:'NIS/NISN',school:'Sekolah',className:'Kelas',birthDate:'Tanggal lahir',gender:'Jenis kelamin',whatsapp:'WhatsApp',email:'Email',status:'Status akun'};document.getElementById('profile-data').innerHTML=Object.keys(labels).map(function(key){return '<div class="profile-field"><small>'+labels[key]+'</small><b>'+escape(response.data.profile[key]||'—')+'</b></div>'}).join('')})}
  document.querySelectorAll('[data-screen-target]').forEach(function(button){button.addEventListener('click',function(){showScreen(button.dataset.screenTarget)})});
  document.getElementById('start-quiz').addEventListener('click',function(){window.PM.notify('Quiz engine tersedia pada Phase 5.')});
  document.getElementById('logout-button').addEventListener('click',function(){var token=state.token;this.disabled=true;call('logout',[token],function(response){sessionStorage.removeItem('pm_session');window.PM.notify(response.message);setTimeout(function(){location.reload()},500)})});
  window.PM={start:start,notify:function(message){var toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(this.timer);this.timer=setTimeout(function(){toast.classList.remove('show')},3500)}};
  var saved=sessionStorage.getItem('pm_session');if(saved)start(saved);
})();
</script>
