<script>
(function(){
  var state={token:'',dashboard:null,quiz:null,timer:null};
  function call(name,args,done){var runner=google.script.run.withSuccessHandler(done).withFailureHandler(function(){window.PM.notify('Koneksi ke layanan terputus.')});runner[name].apply(runner,args)}
  function text(id,value){document.getElementById(id).textContent=value==null?'—':value}
  function escape(value){var node=document.createElement('div');node.textContent=String(value||'');return node.innerHTML}
  function showScreen(name){document.querySelectorAll('.app-screen').forEach(function(el){el.classList.toggle('active',el.dataset.screen===name)});document.querySelectorAll('.bottom-nav [data-screen-target]').forEach(function(el){el.classList.toggle('active',el.dataset.screenTarget===name)});if(name==='profile')loadProfile();window.scrollTo({top:0,behavior:'smooth'})}
  function rankRows(items){return items.length?items.map(function(item){return '<article class="rank-row"><strong>#'+item.rank+'</strong><div><span>'+escape(item.name)+'</span><small>'+escape(item.school)+'</small></div><b>'+Number(item.point).toLocaleString('id-ID')+' pt</b></article>'}).join(''):'<div class="empty-card">Belum ada perolehan point.</div>'}
  function schoolRows(items){return items.length?items.map(function(item){return '<article class="school-rank-row"><strong>#'+item.rank+'</strong><div><b>'+escape(item.school)+'</b><small>'+item.activeParticipants+' aktif • '+item.quizCompleted+' quiz • rata-rata '+item.averageScore+'</small></div><b>'+Number(item.point).toLocaleString('id-ID')+' pt</b></article>'}).join(''):'<div class="empty-card">Belum ada aktivitas sekolah.</div>'}
  function materialCards(items){return items.length?items.map(function(item){return '<article class="material-card"><small>'+escape(item.category)+'</small><h3>'+escape(item.title)+'</h3><p>'+escape(String(item.content||'').slice(0,140))+'</p></article>'}).join(''):'<div class="empty-card">Materi belum tersedia.</div>'}
  function render(data){state.dashboard=data;text('student-name',data.user.name.split(' ')[0]);text('student-school',data.user.schoolName||'Sekolah belum tersedia');text('student-initial',data.user.name.charAt(0).toUpperCase());text('student-point',Number(data.point).toLocaleString('id-ID'));text('student-rank',data.rank?'#'+data.rank:'—');text('season-name',data.season?data.season.name:'Belum ada season aktif');text('season-theme',data.season?(data.season.theme||data.season.description):'Challenge berikutnya akan segera hadir.');text('progress-label',data.progress+'%');document.getElementById('progress-bar').style.width=data.progress+'%';document.getElementById('start-quiz').disabled=!data.season;document.getElementById('top-three').className='rank-list';document.getElementById('top-three').innerHTML=rankRows(data.topThree);document.getElementById('rank-screen-list').innerHTML=rankRows(data.leaderboard||data.topThree);document.getElementById('material-preview').innerHTML=materialCards(data.materials);document.getElementById('material-list').innerHTML=materialCards(data.materials);document.getElementById('announcement-list').innerHTML=data.announcements.length?data.announcements.map(function(item){return '<article class="announcement"><b>'+escape(item.title)+'</b><p>'+escape(item.content)+'</p></article>'}).join(''):'<div class="empty-card">Belum ada pengumuman.</div>';var winner=document.getElementById('winner-section');winner.hidden=!data.latestWinner;if(data.latestWinner){text('winner-season',data.latestWinner.season);text('winner-name',data.latestWinner.name);text('winner-school',data.latestWinner.school);text('winner-point',Number(data.latestWinner.point).toLocaleString('id-ID')+' pt')}document.getElementById('app-loading').hidden=true;document.getElementById('app-content').hidden=false}
  function start(token){state.token=token;document.querySelectorAll('.public-view').forEach(function(el){el.hidden=true});document.getElementById('student-app').hidden=false;document.getElementById('app-loading').hidden=false;document.getElementById('app-content').hidden=true;call('getStudentDashboard',[token],function(response){if(!response.success){sessionStorage.removeItem('pm_session');window.PM.notify(response.message);setTimeout(function(){location.reload()},700);return}render(response.data)})}
  function loadProfile(){if(!state.token)return;call('getStudentProfile',[state.token],function(response){if(!response.success){window.PM.notify(response.message);return}var labels={name:'Nama lengkap',nis:'NIS/NISN',school:'Sekolah',className:'Kelas',birthDate:'Tanggal lahir',gender:'Jenis kelamin',whatsapp:'WhatsApp',email:'Email',status:'Status akun'};document.getElementById('profile-data').innerHTML=Object.keys(labels).map(function(key){return '<div class="profile-field"><small>'+labels[key]+'</small><b>'+escape(response.data.profile[key]||'—')+'</b></div>'}).join('')});call('getPointHistory',[state.token,state.dashboard&&state.dashboard.season?state.dashboard.season.id:''],function(response){if(!response.success)return;document.getElementById('point-history').innerHTML=response.data.transactions.length?response.data.transactions.map(function(item){return '<article class="point-row"><div><b>'+escape(item.description)+'</b><small>'+escape(item.sourceType)+' • '+escape(item.createdAt)+'</small></div><strong class="'+(item.point<0?'negative':'')+'">'+(item.point>0?'+':'')+item.point+'</strong></article>'}).join(''):'<div class="empty-card">Belum ada transaksi point.</div>'})}
  function tick(seconds){clearInterval(state.timer);var left=Number(seconds||0);function draw(){var min=Math.floor(left/60),sec=left%60;text('quiz-timer',String(min).padStart(2,'0')+':'+String(sec).padStart(2,'0'));if(left<=0){clearInterval(state.timer);window.PM.notify('Waktu quiz telah habis.');return}left--}draw();state.timer=setInterval(draw,1000)}
  function renderQuestion(question){state.quiz.question=question;text('quiz-position','Soal '+question.position+' / '+question.total);text('quiz-category',question.category);text('question-text',question.text);document.getElementById('quiz-progress-bar').style.width=(question.position/question.total*100)+'%';document.getElementById('answer-feedback').hidden=true;var letters=['A','B','C','D'];document.getElementById('answer-options').innerHTML=question.options.map(function(option,index){return '<label class="answer-option"><input type="radio" name="option" value="'+escape(option.id)+'"><span class="option-letter">'+letters[index]+'</span><span>'+escape(option.text)+'</span></label>'}).join('');document.getElementById('submit-answer').disabled=true;document.querySelectorAll('.answer-option').forEach(function(label){label.addEventListener('click',function(){document.querySelectorAll('.answer-option').forEach(function(item){item.classList.remove('selected')});label.classList.add('selected');document.getElementById('submit-answer').disabled=false})});tick(question.remainingSeconds)}
  function showResult(result){clearInterval(state.timer);document.getElementById('question-card').hidden=true;document.getElementById('quiz-result').hidden=false;text('result-correct',result.correct);text('result-wrong',result.wrong);text('result-score',result.score);text('result-point','+'+result.totalAwarded);text('result-summary',(result.bonus?'Termasuk bonus +'+result.bonus+'. ':'')+'Total saldo point: '+Number(result.totalBalance).toLocaleString('id-ID'))}
  function openQuiz(){document.querySelector('.app-header').hidden=true;document.getElementById('app-content').hidden=true;document.querySelector('.bottom-nav').hidden=true;document.getElementById('quiz-view').hidden=false;document.getElementById('question-card').hidden=false;document.getElementById('quiz-result').hidden=true;call('startQuiz',[state.token,{deviceId:localStorage.getItem('pm_device_id')||'',userAgent:navigator.userAgent}],function(response){if(!response.success){closeQuiz();window.PM.notify(response.message);return}state.quiz={sessionId:response.data.sessionId,question:null};text('quiz-season',response.data.seasonName);if(response.data.completed)showResult(response.data.result);else renderQuestion(response.data.question)})}
  function closeQuiz(){clearInterval(state.timer);document.getElementById('quiz-view').hidden=true;document.querySelector('.app-header').hidden=false;document.getElementById('app-content').hidden=false;document.querySelector('.bottom-nav').hidden=false}
  document.querySelectorAll('[data-screen-target]').forEach(function(button){button.addEventListener('click',function(){showScreen(button.dataset.screenTarget)})});
  document.querySelectorAll('[data-rank-tab]').forEach(function(button){button.addEventListener('click',function(){var school=button.dataset.rankTab==='school';document.querySelectorAll('[data-rank-tab]').forEach(function(item){item.classList.toggle('active',item===button)});document.getElementById('rank-screen-list').hidden=school;document.getElementById('school-rank-list').hidden=!school;if(school&&!button.dataset.loaded){call('getSchoolLeaderboard',[state.token,state.dashboard&&state.dashboard.season?state.dashboard.season.id:'',50],function(response){if(!response.success){window.PM.notify(response.message);return}document.getElementById('school-rank-list').innerHTML=schoolRows(response.data.rows);button.dataset.loaded='true'})}})});
  document.getElementById('start-quiz').addEventListener('click',openQuiz);
  document.getElementById('quiz-exit').addEventListener('click',function(){if(confirm('Keluar dari tampilan quiz? Waktu tetap berjalan dan sesi dapat dilanjutkan.'))closeQuiz()});
  document.getElementById('result-home').addEventListener('click',function(){closeQuiz();start(state.token)});
  document.getElementById('answer-form').addEventListener('submit',function(event){event.preventDefault();var selected=this.querySelector('input[name=option]:checked');if(!selected||!state.quiz||!state.quiz.question)return;var button=document.getElementById('submit-answer');button.disabled=true;call('submitQuizAnswer',[state.token,{sessionId:state.quiz.sessionId,answerId:state.quiz.question.answerId,nonce:state.quiz.question.nonce,optionId:selected.value}],function(response){if(!response.success){button.disabled=false;window.PM.notify(response.message);return}var feedback=document.getElementById('answer-feedback');feedback.className='answer-feedback'+(response.data.correct?'':' wrong');feedback.innerHTML='<b>'+(response.data.correct?'✓ Benar +'+response.data.earnedPoint+' point':'Belum tepat')+'</b>'+(response.data.correctAnswer?'<span>Jawaban: '+escape(response.data.correctAnswer)+'</span>':'')+(response.data.explanation?'<p>'+escape(response.data.explanation)+'</p>':'');feedback.hidden=false;document.querySelectorAll('#answer-options input').forEach(function(input){input.disabled=true});setTimeout(function(){if(response.data.completed)showResult(response.data.result);else renderQuestion(response.data.nextQuestion)},900)})});
  document.getElementById('logout-button').addEventListener('click',function(){var token=state.token;this.disabled=true;call('logout',[token],function(response){sessionStorage.removeItem('pm_session');window.PM.notify(response.message);setTimeout(function(){location.reload()},500)})});
  window.PM={start:start,notify:function(message){var toast=document.getElementById('toast');toast.textContent=message;toast.classList.add('show');clearTimeout(this.timer);this.timer=setTimeout(function(){toast.classList.remove('show')},3500)}};
  var saved=sessionStorage.getItem('pm_session');if(saved)start(saved);
})();
</script>
