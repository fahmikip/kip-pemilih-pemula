<script>
(function(){
  var dialog=document.getElementById('auth-dialog'), toast=document.getElementById('toast');
  function deviceId(){var key='pm_device_id',id=localStorage.getItem(key);if(!id){id=(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random()).replace(/-/g,'');localStorage.setItem(key,id)}return id}
  function notify(message){window.PM.notify(message)}
  var installPrompt=null,standalone=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone===true;
  function installButtons(hidden){document.querySelectorAll('[data-install-app]').forEach(function(button){button.hidden=hidden})}
  installButtons(standalone);
  window.addEventListener('beforeinstallprompt',function(event){event.preventDefault();installPrompt=event;installButtons(false)});
  document.querySelectorAll('[data-install-app]').forEach(function(button){button.addEventListener('click',function(){if(installPrompt){installPrompt.prompt();installPrompt.userChoice.then(function(){installPrompt=null})}else if(/iphone|ipad|ipod/i.test(navigator.userAgent)){notify('Ketuk Bagikan, lalu pilih Tambahkan ke Layar Utama.')}else{notify('Buka menu browser lalu pilih Install app atau Tambahkan ke layar utama.')};})});
  window.addEventListener('appinstalled',function(){installButtons(true);notify('PEMILIH MUDA berhasil diinstall.')});
  window.addEventListener('offline',function(){notify('Koneksi internet terputus. Data belum dikirim.')});
  window.addEventListener('online',function(){notify('Koneksi internet kembali tersedia.')});
  window.addEventListener('error',function(event){console.error('Client error',event.error||event.message);notify('Terjadi kesalahan pada tampilan. Silakan muat ulang halaman.')});
  window.addEventListener('unhandledrejection',function(event){console.error('Client promise rejection',event.reason);notify('Permintaan tidak dapat diselesaikan. Silakan coba kembali.')});
  function panel(name){document.querySelectorAll('[data-panel]').forEach(function(el){el.hidden=el.dataset.panel!==name})}
  function busy(form,state){form.querySelectorAll('button,input,select').forEach(function(el){el.disabled=state})}
  document.querySelectorAll('[data-open]').forEach(function(button){button.addEventListener('click',function(){panel(button.dataset.open);dialog.showModal()})});
  document.querySelectorAll('[data-switch]').forEach(function(button){button.addEventListener('click',function(){panel(button.dataset.switch)})});
  dialog.querySelector('.close').addEventListener('click',function(){dialog.close()});
  function route(token,user){if(user.role==='ADMIN'||user.role==='SUPERADMIN')window.PM.startAdmin(token);else window.PM.start(token)}
  document.getElementById('login-form').addEventListener('submit',function(event){event.preventDefault();var form=event.currentTarget,data=Object.fromEntries(new FormData(form));data.deviceId=deviceId();busy(form,true);google.script.run.withSuccessHandler(function(response){busy(form,false);notify(response.message);if(response.success){sessionStorage.setItem('pm_session',response.data.token);dialog.close();form.reset();route(response.data.token,response.data.user)}}).withFailureHandler(function(){busy(form,false);notify('Layanan tidak dapat dihubungi.')}).login(data)});
  document.getElementById('register-form').addEventListener('submit',function(event){event.preventDefault();var form=event.currentTarget,data=Object.fromEntries(new FormData(form));if(data.password!==data.passwordConfirm){notify('Konfirmasi password tidak sama.');return}data.agreement=form.elements.agreement.checked;data.deviceId=deviceId();delete data.passwordConfirm;busy(form,true);google.script.run.withSuccessHandler(function(response){busy(form,false);notify(response.message);if(response.success){form.reset();panel('login')}}).withFailureHandler(function(){busy(form,false);notify('Layanan tidak dapat dihubungi.')}).registerStudent(data)});
  google.script.run.withSuccessHandler(function(response){document.getElementById('service-status').textContent=response.success?'Layanan v'+response.data.version+' siap':response.message}).getPublicBootstrap();
  google.script.run.withSuccessHandler(function(response){var select=document.querySelector('[name=schoolId]');select.innerHTML='<option value="">Pilih sekolah</option>';if(response.success)response.data.schools.forEach(function(school){var option=document.createElement('option');option.value=school.schoolId;option.textContent=school.name+(school.district?' — '+school.district:'');select.appendChild(option)})}).listPublicSchools();
  google.script.run.withSuccessHandler(function(response){var list=document.getElementById('public-top-three');list.innerHTML='';if(!response.success||!response.data.rows.length){list.textContent='Leaderboard belum tersedia.';list.className='empty-card';return}response.data.rows.forEach(function(item){var row=document.createElement('article'),rank=document.createElement('strong'),info=document.createElement('div'),name=document.createElement('span'),school=document.createElement('small'),point=document.createElement('b');row.className='rank-row';rank.textContent='#'+item.rank;name.textContent=item.name;school.textContent=item.school;point.textContent=Number(item.point).toLocaleString('id-ID')+' pt';info.append(name,school);row.append(rank,info,point);list.appendChild(row)})}).getPublicLeaderboard('');
  google.script.run.withSuccessHandler(function(response){var list=document.getElementById('public-materials');list.innerHTML='';if(!response.success||!response.data.materials.length){list.textContent='Materi belum tersedia.';return}response.data.materials.forEach(function(item){var card=document.createElement('article'),category=document.createElement('small'),title=document.createElement('h3'),excerpt=document.createElement('p');card.className='material-card';card.tabIndex=0;card.dataset.materialId=item.id;category.textContent=item.category;title.textContent=item.title;excerpt.textContent=item.excerpt;card.append(category,title,excerpt);list.appendChild(card)})}).getPublicMaterials(4);
  var saved=sessionStorage.getItem('pm_session');if(saved)google.script.run.withSuccessHandler(function(response){if(response.success)route(saved,response.data.user);else sessionStorage.removeItem('pm_session')}).getCurrentUser(saved);
})();
</script>
